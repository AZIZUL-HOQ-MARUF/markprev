<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>

    <!-- Node Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.25" />
    </filter>

    <!-- Connector Gradient -->
    <linearGradient id="lineGrad" x1="16" y1="18" x2="48" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a5b4fc" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
  </defs>

  <!-- Squircle Base Container -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />

  <!-- Subtle Inner Border Highlight -->
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.5" />

  <!-- Flowchart Connectors (Flow lines) -->
  <!-- Left branch down to center -->
  <path d="M22 24 L32 40" stroke="url(#lineGrad)" stroke-width="3" stroke-linecap="round" />
  <!-- Right branch down to center -->
  <path d="M42 24 L32 40" stroke="url(#lineGrad)" stroke-width="3" stroke-linecap="round" />
  <!-- Horizontal bridging arrow -->
  <path d="M25 21 L39 21" stroke="#ffffff" stroke-opacity="0.8" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="2 3" />

  <!-- Node 1: Left Input Node (Markdown / Source) -->
  <g filter="url(#glow)">
    <circle cx="20" cy="21" r="7" fill="#ffffff" />
    <path d="M17.5 24 V18 L20 21 L22.5 18 V24" stroke="#4f46e5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Node 2: Right Output Node (Preview / Graph) -->
  <g filter="url(#glow)">
    <circle cx="44" cy="21" r="7" fill="#ffffff" />
    <!-- Graph TD / Diagram Icon inside right node -->
    <circle cx="44" cy="18.5" r="1.5" fill="#9333ea" />
    <circle cx="41.5" cy="23" r="1.2" fill="#9333ea" />
    <circle cx="46.5" cy="23" r="1.2" fill="#9333ea" />
    <path d="M44 19.5 L42 22 M44 19.5 L46 22" stroke="#9333ea" stroke-width="1.2" stroke-linecap="round" />
  </g>

  <!-- Node 3: Bottom Synthesis / High-Res Result Node -->
  <g filter="url(#glow)">
    <rect x="23" y="38" width="18" height="12" rx="4" fill="#38bdf8" />
    <!-- Eye / Check icon -->
    <path d="M28 44 L31 47 L36 41" stroke="#0f172a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>